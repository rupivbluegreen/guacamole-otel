# Example Secrets — DO NOT COMMIT REAL VALUES. Copy, fill in, apply out-of-band
# (or manage via a sealed-secrets / external-secrets operator).
apiVersion: v1
kind: Secret
metadata:
  name: guacamole-db
  labels: { app.kubernetes.io/part-of: guacamole-otel }
type: Opaque
stringData:
  hostname: postgres.example.svc
  database: guacamole_db
  username: guacamole_user
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: guacamole-otel-backend
  labels: { app.kubernetes.io/part-of: guacamole-otel }
type: Opaque
stringData:
  # host:port of your OTLP backend (Tempo/Loki/Mimir gateway, SigNoz, ...).
  otlp-endpoint: otel-backend.example.svc:4317
