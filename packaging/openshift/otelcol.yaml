# OpenTelemetry Collector Deployment + Service for OpenShift/Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-otelcol
  labels: { app.kubernetes.io/name: guacamole-otelcol, app.kubernetes.io/part-of: guacamole-otel }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: guacamole-otelcol }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacamole-otelcol, app.kubernetes.io/part-of: guacamole-otel }
    spec:
      # OpenShift restricted-v2 SCC: no fixed UID needed, no privileges.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:latest
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: OTLP_EXPORTER_ENDPOINT
              valueFrom:
                secretKeyRef: { name: guacamole-otel-backend, key: otlp-endpoint }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
      volumes:
        - name: config
          configMap: { name: guacamole-otelcol }
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-otelcol
  labels: { app.kubernetes.io/part-of: guacamole-otel }
spec:
  selector: { app.kubernetes.io/name: guacamole-otelcol }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
