# Guacamole (instrumented image) + guacd for OpenShift/Kubernetes.
# Requires: a PostgreSQL reachable as per the Secret, and the guacamole-otel image
# pushed to a registry the cluster can pull. Postgres itself is out of scope here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
  labels: { app.kubernetes.io/name: guacamole-guacd, app.kubernetes.io/part-of: guacamole-otel }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: guacamole-guacd } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacamole-guacd, app.kubernetes.io/part-of: guacamole-otel }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          ports: [{ name: guacd, containerPort: 4822 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-guacd
  labels: { app.kubernetes.io/part-of: guacamole-otel }
spec:
  selector: { app.kubernetes.io/name: guacamole-guacd }
  ports: [{ name: guacd, port: 4822, targetPort: 4822 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  labels: { app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: guacamole-otel }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: guacamole } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: guacamole-otel }
    spec:
      # Arbitrary-UID safe: the baked agent + extension jars are world-readable (0644).
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: guacamole
          image: guacamole-otel:0.2.0   # push the packaging/docker/Dockerfile build here
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: GUACD_HOSTNAME, value: guacamole-guacd }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://guacamole-otelcol:4317" }
            - name: POSTGRESQL_HOSTNAME
              valueFrom: { secretKeyRef: { name: guacamole-db, key: hostname } }
            - name: POSTGRESQL_DATABASE
              valueFrom: { secretKeyRef: { name: guacamole-db, key: database } }
            - name: POSTGRESQL_USER
              valueFrom: { secretKeyRef: { name: guacamole-db, key: username } }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: guacamole-db, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /guacamole/, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  labels: { app.kubernetes.io/part-of: guacamole-otel }
spec:
  selector: { app.kubernetes.io/name: guacamole }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# OpenShift Route for the UI (drop this on plain Kubernetes; use an Ingress instead).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: guacamole
  labels: { app.kubernetes.io/part-of: guacamole-otel }
spec:
  to: { kind: Service, name: guacamole }
  port: { targetPort: http }
  tls: { termination: edge }
