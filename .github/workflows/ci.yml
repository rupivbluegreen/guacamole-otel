name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Build and test
        run: mvn -q -f extension/pom.xml verify
      - name: Validate collector config
        run: |
          curl -sSfL -o otelcol.tar.gz "$OTELCOL_URL"
          tar xzf otelcol.tar.gz otelcol-contrib
          ./otelcol-contrib validate --config collector/otelcol-guacamole.yaml
        env:
          OTELCOL_URL: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/latest/download/otelcol-contrib_linux_amd64.tar.gz
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: tim-actions/dco@master
