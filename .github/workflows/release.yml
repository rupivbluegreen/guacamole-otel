# Release: build the jar + RPM, checksum them, and publish a GitHub Release with the
# assets attached. Triggered by pushing a v* tag, or manually via workflow_dispatch.
# Uses the built-in GITHUB_TOKEN (no third-party publish action). Notes are
# auto-generated per .github/release.yml categories.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build + release (e.g. 0.1.0)
        required: true

permissions:
  contents: write   # required to create the Release and upload assets
  id-token: write   # keyless cosign signing (Sigstore OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: "17", cache: maven }

      - name: Resolve version + tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; ver="${REF_NAME#v}";
          else ver="$INPUT_VERSION"; tag="v$INPUT_VERSION"; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"

      - name: Build jar + RPM + checksums
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mvn -q -f extension/pom.xml verify
          mkdir -p dist
          docker run --rm -e VERSION="$VERSION" -v "$PWD":/work -w /work/packaging \
            goreleaser/nfpm@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c package --config nfpm.yaml --target /work/dist --packager rpm
          cp extension/target/guacamole-otel-extension.jar dist/
          cp extension/target/guacamole-otel-extension-sbom.json dist/
          cp extension/target/guacamole-otel-extension-sbom.xml dist/
          ( cd dist && sha256sum guacamole-otel-extension.jar *.rpm *sbom* > SHA256SUMS )

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign artifacts (keyless / Sigstore)
        run: |
          cd dist
          for f in guacamole-otel-extension.jar *.rpm SHA256SUMS; do
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber \
              dist/guacamole-otel-extension.jar dist/*.rpm dist/*sbom* dist/SHA256SUMS dist/*.cosign.bundle
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes \
              dist/guacamole-otel-extension.jar dist/*.rpm dist/*sbom* dist/SHA256SUMS dist/*.cosign.bundle
          fi
