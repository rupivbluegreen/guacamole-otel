# Go CI for the collector receiver (Phase 5). Separate from ci.yml so the two
# never conflict. Only runs when the receiver changes.
name: go
on:
  push:
    branches: [main]
    paths: ["receiver/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["receiver/**", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiver/guacamolereceiver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: receiver/guacamolereceiver/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -coverprofile=coverage.out ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: receiver/guacamolereceiver
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
