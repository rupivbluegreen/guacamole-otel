# Dependency review gate.
#
# On every pull request, compares the dependency graph of the base and head
# refs and fails the check if the PR introduces a dependency with a known
# vulnerability or a license that is not Apache-2.0 compatible. This enforces,
# at review time, the "Apache-2.0-compatible dependencies only / no copyleft"
# rule from CONTRIBUTING.md, which is otherwise only manual.
#
# Analysis only: read-only token, no publish/push/release (guardrail G10). The
# third-party action is pinned to a full commit SHA (the trailing comment
# records the tag).
name: dependency-review

on:
  pull_request:
    branches: [main]

# Least privilege: the action only needs to read the dependency graph.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail on newly introduced High/Critical advisories.
          fail-on-severity: high
          # Block strong/network copyleft licenses (ASF Category X): not
          # Apache-2.0 compatible. SPDX identifiers; unknown licenses are
          # surfaced but cannot be auto-denied.
          deny-licenses: >-
            GPL-1.0-only, GPL-1.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
          # Summary is written to the run's job summary; no PR write permission
          # is requested (least privilege).
          comment-summary-in-pr: never
